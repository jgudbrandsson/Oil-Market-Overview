[project]
name = "oil-dash"
version = "0.1.0"
description = "Self-hosted oil market dashboard"
requires-python = ">=3.11"
dependencies = []  # fetchers use the standard library only

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
